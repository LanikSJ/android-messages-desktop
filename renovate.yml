$schema: https://renovatebot.com
extends:
  - config:best-practices
  - :semanticCommitTypeAll(ci)
  - :disableRateLimiting
  - :disableDependencyDashboard
semanticCommits: enabled
commitMessageLowerCase: auto
prTitleEnabled: true
prBody: ""

packageRules:
  - matchDepTypes:
      - dependencies
    semanticCommitType: ci
  - matchDepTypes:
      - devDependencies
    semanticCommitType: ci
  - matchManagers:
      - npm
    matchUpdateTypes:
      - minor
      - patch
    groupName: "npm minor and patch updates"
    groupSlug: "npm-minor-patch"
  - matchManagers:
      - npm
    matchUpdateTypes:
      - major
    groupName: null
